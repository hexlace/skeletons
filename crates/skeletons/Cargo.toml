[package]
name = "skeletons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Skeletons — keep your repos from drifting apart. A ritual bundle: it mounts in your project's ritual command line."
readme = "readme.md"
# A library bundle, not an application: `command-line-utilities` is for
# programs a user installs, and this crate has no binary. It is the parts a
# project's own command line is built from, which is what
# `command-line-interface` holds.
categories = ["command-line-interface", "development-tools"]

[dependencies]
# The `Task` this crate's one function returns.
rituals.workspace = true
# The commands themselves: this crate mounts what the engine builds.
skeletons-engine.workspace = true

[features]
# Forwards the engine's `test-util` feature, which compiles in the seams that
# let a test observe or redirect a real network request or a real wait. For a
# dependent's `[dev-dependencies]` only, and never enabled outside them: only
# `cargo test` unifies it in.
test-util = ["skeletons-engine/test-util"]

[package.metadata.ritual]
task = true

[lints]
workspace = true
