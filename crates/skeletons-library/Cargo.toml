[package]
name = "skeletons-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["drift", "config", "cargo"]
description = "The supported library for skeletons: reads a workspace offline and reports, as data, which files its worn skeletons claim and whether each one matches."
readme = "readme.md"
categories = ["development-tools"]

[dependencies]
# Reading a workspace and surveying it, which is all the answer is made from.
# Asked for without its `commands` feature, so the command-line framework, the
# network client and the manifest editor are never compiled for a project that
# depends on this crate.
skeletons-engine.workspace = true
# The type behind `Version`, which wraps it so that no dependency's type is
# part of this crate's own interface.
semver.workspace = true

[dev-dependencies]
# The workspaces and skeletons the tests write, each in a directory of its own.
tempfile.workspace = true

[lints]
workspace = true
