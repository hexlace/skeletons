# `skeletons` CI — one independent job per check:
#
#   format   — cargo fmt --all -- --check
#   clippy   — cargo clippy --workspace --all-targets -- -D warnings, then
#              the same for skeletons alone, on Linux and macOS
#   test     — cargo test -p skeletons, then cargo test --workspace, on Linux
#              and macOS, with the tests each platform skipped listed in the
#              job summary
#   doc      — cargo doc --workspace --no-deps --document-private-items, with
#              rustdoc warnings fatal
#   package  — cargo package --workspace: every crate packages and builds from
#              its package alone, as crates.io would receive it, and the
#              bundle's tests pass from its unpacked package
#   msrv     — cargo test on the oldest toolchain `rust-version` declares
#   deny     — cargo deny check: advisories, licences, bans and sources, as
#              `deny.toml` sets them; weekly, advisories alone
#
# Nothing here `needs` anything else, and nothing caches: a cold build is fast
# enough that a shared cache's invalidation and poisoning risks cost more than
# it saves.
#
# clippy and test run on both supported platforms because they see different
# code: a `cfg(target_os)` item is linted only where it compiles, and each
# platform-dependent test runs where its premise holds and skips elsewhere.
# The other checks read nothing platform-specific, so Linux alone decides them.

name: CI

on:
  # A push to a PR branch already triggers `pull_request` below; scoping `push`
  # to `main` keeps post-merge validation without running the whole workflow
  # twice per PR push.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  # A new RustSec advisory lands against an unchanged lockfile, so the deny
  # job checks advisories weekly too. Every other job skips a scheduled run:
  # nothing else it checks can change while the repository does not.
  schedule:
    - cron: "17 6 * * 1"

# Cancel superseded runs on rapid re-pushes to the same ref — but never on
# `main`, so every merge is fully validated to completion. The event is part of
# the group because a group holds one pending run and a newer one replaces it:
# the weekly run also runs on `main`, and sharing a group with merges would let
# either one displace the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege GITHUB_TOKEN — only checkout (contents: read) is needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing after checkout talks to the remote, so the token is not left
        # in .git/config for a later step to read. Every job below repeats it.
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # rust-toolchain.toml pins the channel and components, and with no
        # toolchain argument `rustup toolchain install` installs exactly what
        # that file names. It is installed explicitly because rustup has
        # deprecated installing a missing toolchain as a side effect of other
        # commands.
        # The second command prints what is active, so the log records which
        # compiler the gate ran under. Every job below repeats this step.
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      # One platform's lint failure says nothing about the other's, so both
      # always finish. The test job below does the same.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy skeletons alone
        # The workspace run above lints `skeletons` with its `test-util`
        # feature, which `ritual`'s dev-dependency turns on, so code that only
        # compiles without the feature is never linted there. This run has no
        # such unification, as `test skeletons alone` does for the tests.
        run: cargo clippy -p skeletons --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: test skeletons alone
        # The bundle's own unit tests, built without `ritual`. The workspace
        # run below builds `skeletons` with its `test-util` feature, which
        # `ritual`'s dev-dependency turns on for every package in the build, so
        # it can never see a test seam that only `test-util` provides and the
        # crate's own test build lacks. This run has no such unification.
        run: cargo test -p skeletons

      - name: test
        # A test whose premise does not hold on this platform prints
        # `skipped: <premise>` to stderr and passes. The test harness captures
        # a passing test's output and discards it, so `--show-output` prints it
        # under the test's name, and the log is kept for the step below.
        # `shell: bash` runs with pipefail, so a failing test still fails the
        # step through `tee`.
        shell: bash
        run: cargo test --workspace -- --show-output 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: list skipped tests
        # Which tests skipped, and why, in the job summary. The list differs by
        # platform, and a premise that stops holding on a runner shows up here
        # as a change in it rather than as nothing at all. Runs after a test
        # failure too, since the skips are half of reading one.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          awk '
            /^---- .* stdout ----$/ { name = $2; next }
            /^skipped: / { sub(/^skipped: /, ""); printf "- `%s`: %s\n", name, $0 }
          ' "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/skipped.md"
          count=$(wc -l < "$RUNNER_TEMP/skipped.md" | tr -d ' ')
          {
            echo "### ${count} skipped on ${RUNNER_OS}"
            echo
            cat "$RUNNER_TEMP/skipped.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  doc:
    name: doc
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: doc
        # A rustdoc warning, such as a broken intra-doc link, fails the job
        # rather than scrolling past in the log. Private items are documented
        # too: most of the bundle is crate-private, and without the flag none
        # of its doc comments would be checked at all.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  package:
    name: package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: package
        # Packages every crate and builds each one from its package alone,
        # with its sibling crates' packages standing in for crates.io. A path
        # dependency without a version, or a file a crate needs that its
        # package leaves out, fails here rather than at publish time.
        run: cargo package --workspace --locked

      - name: test the published package
        # Runs the bundle's tests from its unpacked package, the way anyone
        # testing the crate crates.io serves would. The package leaves out the
        # test skeletons, captures and documents some tests read, and
        # `build.rs` compiles those tests only in a checkout; a new test that
        # reads a left-out file without that gate fails here, where a checkout
        # run would not notice. Run from the repository so rust-toolchain.toml
        # still picks the compiler.
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '
            .packages[] | select(.name == "skeletons") | .version')
          tar -xzf "target/package/skeletons-$version.crate" -C "$RUNNER_TEMP"
          cargo test --locked \
            --manifest-path "$RUNNER_TEMP/skeletons-$version/Cargo.toml"

  msrv:
    name: msrv
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        # The pinned toolchain reads `rust-version` out of the manifests, so the
        # version checked here is always the one the crates declare; every
        # member inherits it from the workspace, and a member that stopped
        # agreeing fails this step. `1.85` means 1.85.0 to Cargo but the newest
        # 1.85.x to rustup, so a two-part version gets its `.0` back first.
        run: |
          rustup toolchain install --no-self-update
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -er '
            [.packages[].rust_version] | unique
            | if length == 1 then .[0] else error("members disagree on rust-version: \(.)") end
            | if (split(".") | length) == 2 then . + ".0" else . end')
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: test on the minimum supported toolchain
        # The whole suite, not only a check: the tests build and run a command
        # line that mounts the bundle, which is what a project on the minimum
        # version does.
        run: cargo "+$MSRV" test --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # cargo-deny reads the dependency graph through `cargo metadata`.
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Install cargo-deny
        # The release binary, pinned by version and by the SHA-256 of its
        # archive, so what runs here is exactly the build that was checked
        # when the pin was set. To move the pin, take the new release's
        # version and the checksum from its `.sha256` file beside the archive.
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          releases="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "$releases/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/cargo-deny" --version

      - name: deny check
        if: github.event_name != 'schedule'
        run: cargo deny --locked check

      - name: deny check advisories
        if: github.event_name == 'schedule'
        run: cargo deny --locked check advisories
